name: service-restaurant-ci

on:
  push:
    branches: [main]
    paths:
      - "service-restaurant/**"
      - ".github/workflows/service-restaurant-ci.yml"
  pull_request:
    paths:
      - "service-restaurant/**"
      - ".github/workflows/service-restaurant-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: service-restaurant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: service-restaurant/go.mod
          cache-dependency-path: service-restaurant/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Pruebas unitarias y de arquitectura (con -race)
        run: go test -race $(go list ./... | grep -v /tests/integration)
      # El runner de ubuntu trae Docker: testcontainers levanta PostgreSQL 18 limpio.
      - name: Pruebas de integracion (PostgreSQL 18)
        run: go test -count=1 ./tests/integration/...
      - name: Build
        run: go build ./cmd/api ./cmd/migrate

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen (sin publicar)
        run: docker build -t service-restaurant:ci .
