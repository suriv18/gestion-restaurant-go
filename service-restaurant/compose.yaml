services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
