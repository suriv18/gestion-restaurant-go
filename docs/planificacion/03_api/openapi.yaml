components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Propuesta sujeta a DEC 06; autorización efectiva y sucursal se resuelven en el servidor.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Una clave por intención. Repetición idéntica retorna mismo efecto; contenido distinto con misma clave produce
        409.
  schemas:
    Id: &id008
      type: string
      pattern: ^[1-9][0-9]*$
      description: Identificador BIGINT serializado como cadena.
    Dinero:
      type: string
      pattern: ^[0-9]{1,12}(\.[0-9]{1,2})?$
      description: Importe decimal exacto, sin separador de miles. La operación puede exigir mayor que cero.
    Cantidad:
      type: string
      pattern: ^[0-9]{1,11}(\.[0-9]{1,3})?$
      description: Cantidad decimal exacta. Debe ser positiva cuando la operación así lo indique.
    Error:
      type: object
      description: Problema HTTP (application/problem+json). El campo con error se codifica en code (por ejemplo posicion_x_invalida, motivo_requerido).
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
    Operacion:
      type: object
      required:
      - id
      - estado
      properties:
        id:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
        recurso:
          type: string
        referencias:
          type: object
          additionalProperties: *id008
    Motivo:
      type: object
      additionalProperties: false
      required:
      - motivo
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 2000
    Confirmacion:
      type: object
      additionalProperties: false
      properties: {}
    Negocio:
      type: object
      description: Una unica empresa por base. La configuracion tributaria es explicita.
      required:
      - id
      - singleton
      - ruc
      - razon_social
      - nombre_comercial
      - direccion_fiscal
      - moneda
      - zona_horaria
      - es_activo
      - creado_en
      - creado_por
      - actualizado_en
      - actualizado_por
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        singleton:
          type: boolean
        ruc: &id108
          type: string
          maxLength: 11
        razon_social: &id109
          type: string
          maxLength: 250
        nombre_comercial: &id110
          type: string
          maxLength: 150
        direccion_fiscal: &id111
          type: string
          maxLength: 500
        ubigeo: &id112
          anyOf:
          - type: string
            maxLength: 6
          - type: 'null'
        telefono: &id113
          anyOf:
          - type: string
            maxLength: 30
          - type: 'null'
        email: &id114
          anyOf:
          - type: string
            maxLength: 254
          - type: 'null'
        moneda: &id115
          type: string
          maxLength: 3
        zona_horaria: &id116
          type: string
          maxLength: 60
        es_activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true
        creado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
    Sucursales:
      type: object
      description: Locales operativos de la misma empresa.
      required:
      - id
      - negocio_id
      - codigo
      - nombre
      - direccion
      - es_activo
      - creado_en
      - creado_por
      - actualizado_en
      - actualizado_por
      - ubigeo
      - codigo_establecimiento_sunat
      - telefono
      - eliminado_en
      - eliminado_por
      - motivo_eliminacion
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        negocio_id: &id093
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
        codigo: &id094
          type: string
          maxLength: 20
        nombre: &id095
          type: string
          maxLength: 120
        direccion: &id096
          type: string
          maxLength: 500
        ubigeo: &id097
          anyOf:
          - type: string
            maxLength: 6
          - type: 'null'
        codigo_establecimiento_sunat: &id098
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
        telefono: &id099
          anyOf:
          - type: string
            maxLength: 30
          - type: 'null'
        es_activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true
        creado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        eliminado_en:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          readOnly: true
        eliminado_por:
          anyOf:
          - type: string
            pattern: ^[1-9][0-9]*$
            description: Identificador BIGINT serializado como cadena.
          - type: 'null'
          readOnly: true
        motivo_eliminacion:
          anyOf:
          - type: string
          - type: 'null'
          readOnly: true
    Roles:
      type: object
      description: Roles de aplicacion; no son roles PostgreSQL.
      required:
      - id
      - codigo
      - nombre
      - es_activo
      - creado_en
      - creado_por
      - actualizado_en
      - actualizado_por
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        codigo: &id101
          type: string
          maxLength: 40
        nombre: &id102
          type: string
          maxLength: 80
        descripcion: &id103
          anyOf:
          - type: string
          - type: 'null'
        es_activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
          readOnly: true
        creado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
    Permisos:
      type: object
      description: Permisos funcionales que debe verificar el backend.
      required:
      - id
      - codigo
      - descripcion
      - creado_en
      - creado_por
      - actualizado_en
      - actualizado_por
      - es_activo
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        codigo: &id105
          type: string
          maxLength: 80
        descripcion: &id106
          type: string
          maxLength: 250
        creado_en:
          type: string
          format: date-time
          readOnly: true
        creado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_por:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Identificador BIGINT serializado como cadena.
          readOnly: true
        es_activo:
          type: boolean
    RolesPermisos:
      type: object
      description: Asignacion de permisos a roles.
      required:
      - id
      - rol_id
      - permiso_id
      - creado_en
      - creado_por
      - actualizado_en
