openapi: 3.1.1
info:
  title: Contrato propuesto del sistema de restaurante
  version: 0.2.0
  description: Especificación de desarrollo, NO API desplegada. Basada en SQL V3 PostgreSQL 18. Una empresa por base, permisos
    y sucursal obligatorios. Importes e IDs como cadenas. DTOs derivan de tablas; el backend debe implementar reglas, seguridad
    e idempotencia. Campos creado_por, actualizado_por o equivalentes nunca se aceptan del cliente. Algunas capacidades requieren
    migraciones adicionales, señaladas en la documentación.
servers:
- url: http://localhost:8080/api/v1
  description: Destino de desarrollo propuesto, no servidor incluido
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: operacion_001
      summary: Autenticar usuario humano
      tags:
      - Accesos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
      x-implementado: true
      x-permiso: Permiso fino pendiente de migración en el catálogo
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400': &id001
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id002
          description: Identidad no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id003
          description: Permiso o sucursal no autorizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id004
          description: Recurso no encontrado o no visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id005
          description: Conflicto de estado, idempotencia, saldo o stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id006
          description: Error de regla o validación de campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id007
          description: Servicio temporalmente no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /sesion:
    get:
      operationId: operacion_002
      summary: Consultar usuario y permisos vigentes
      tags:
      - Accesos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
      x-implementado: true
      x-permiso: Permiso fino pendiente de migración en el catálogo
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionActual'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
  /negocio:
    get:
      operationId: operacion_003
      summary: Consultar negocio
      tags:
      - Configuración
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
      x-implementado: true
      x-permiso: NEGOCIO_VER | NEGOCIO_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Negocio'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
    patch:
      operationId: operacion_004
      summary: Editar negocio
      tags:
      - Configuración
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
      x-implementado: true
      x-permiso: NEGOCIO_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Negocio'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegocioEdicion'
  /productos:
    get:
      operationId: operacion_005
      summary: Listar productos
      tags:
      - Catálogos
      description: >-
        Lista paginada por cursor (id ascendente) del maestro global de productos. Por defecto solo activos;
        `es_activo=todos` lista también las bajas. Con `sucursal_id` cada ítem añade `en_sucursal` (estado en esa
        sede, null si no hay fila activa) y se habilita el filtro `disponible`.
      x-implementado: true
      x-permiso: CARTA_VER | CARTA_DISPONIBILIDAD | CARTA_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductosLista'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: sucursal_id
        in: query
        schema:
          $ref: '#/components/schemas/Id'
        description: Sede cuyo estado se añade a cada ítem como `en_sucursal`; el actor necesita CARTA_VER, CARTA_DISPONIBILIDAD o CARTA_ADMINISTRAR en ella (si no, 404).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
          maxLength: 150
        description: Busca en el nombre (contiene) o en el inicio del código.
      - name: es_activo
        in: query
        description: Por defecto solo activos; `todos` no filtra por estado.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - todos
          default: 'true'
      - name: categoria_id
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      - name: disponible
        in: query
        schema:
          type: boolean
        description: Requiere `sucursal_id` (400 `disponible_requiere_sucursal`). true = habilitado en esa sede; false = pausado en esa sede (los productos sin fila no aparecen; se ven sin este filtro con `en_sucursal` null).
    post:
      operationId: operacion_006
      summary: Crear productos
      tags:
      - Catálogos
      description: >-
        Alta del producto. `codigo` único aunque el producto esté dado de baja (409 `codigo_duplicado`). `tipo`
        REVENTA exige `articulo_id` (hasta I5 no hay artículos: 422 `referencia_invalida`); `afectacion_igv` 10 exige
        `impuesto_id` (422 `impuesto_requerido`). Categoría e impuesto deben estar activos (422
        `referencia_invalida`). Exige Idempotency-Key.
      x-implementado: true
      x-permiso: CARTA_ADMINISTRAR
      responses:
        '201':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productos'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductosAlta'
  /productos/{id}:
    get:
      operationId: operacion_007
      summary: Consultar productos
      tags:
      - Catálogos
      description: >-
        Detalle del producto, también si está dado de baja. Con `sucursal_id` añade `en_sucursal`.
      x-implementado: true
      x-permiso: CARTA_VER | CARTA_DISPONIBILIDAD | CARTA_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productos'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: sucursal_id
        in: query
        schema:
          $ref: '#/components/schemas/Id'
        description: Si se indica, la respuesta añade `en_sucursal` con el estado del producto en esa sede.
    patch:
      operationId: operacion_008
      summary: Editar productos
      tags:
      - Catálogos
      description: >-
        Edición parcial con los campos del alta; `descripcion`, `articulo_id`, `impuesto_id` e `imagen_url` admiten
        null para vaciar. Producto dado de baja: 409 `producto_inactivo`; sin cambios: 422 `sin_cambios`.
      x-implementado: true
      x-permiso: CARTA_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productos'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductosEdicion'
  /productos/{id}/baja:
    post:
      operationId: operacion_009
      summary: Dar de baja productos
      tags:
      - Catálogos
      description: >-
        Baja con `motivo` obligatorio (décimo maestro principal): retira el producto de todas las sedes. Ya dado de
        baja: 409 `ya_dada_de_baja`. Exige Idempotency-Key.
      x-implementado: true
      x-permiso: CARTA_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productos'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
  /productos/{id}/restauracion:
    post:
      operationId: operacion_010
      summary: Restaurar productos
      tags:
      - Catálogos
      description: >-
        Reactiva el mismo ID y limpia los marcadores de baja. Ya activo: 409 `ya_activa`; categoría, artículo o
        impuesto dados de baja: 409 `referencia_inactiva`. Exige Idempotency-Key.
      x-implementado: true
      x-permiso: CARTA_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Productos'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Confirmacion'
  /clientes:
    get:
      operationId: operacion_011
      summary: Listar clientes
      tags:
      - Catálogos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
      x-implementado: false
      x-permiso: Permiso fino pendiente de migración en el catálogo
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientesLista'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: sucursal_id
        in: query
        schema:
          $ref: '#/components/schemas/Id'
        description: Filtro solicitado, siempre validado contra sedes autorizadas.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: cursor
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
          maxLength: 150
      - name: es_activo
        in: query
        schema:
          type: boolean
          default: true
    post:
      operationId: operacion_012
      summary: Crear clientes
      tags:
      - Catálogos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
        Idempotency-Key identifica la intención estable. La API debe persistir el resultado; para comandos sin columna propia
        en V4 se requiere diseño y migración adicional.
      x-implementado: false
      x-permiso: Permiso fino pendiente de migración en el catálogo
      responses:
        '201':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clientes'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientesAlta'
  /clientes/{id}:
