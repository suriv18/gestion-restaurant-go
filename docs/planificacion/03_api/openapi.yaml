          application/json:
            schema:
              $ref: '#/components/schemas/ClientesEdicion'
  /clientes/{id}/baja:
    post:
      operationId: operacion_015
      summary: Dar de baja clientes
      tags:
      - Catálogos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
