          type: string
          enum:
          - PREPARADO
          - REVENTA
          - ADICIONAL
          - SERVICIO
          description: REVENTA exige articulo_id y los demás tipos no lo admiten.
        articulo_id: &id014
          anyOf:
          - type: string
            pattern: ^[1-9][0-9]*$
