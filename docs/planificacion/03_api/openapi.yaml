      operationId: operacion_019
      summary: Consultar proveedores
      tags:
      - Catálogos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
      x-implementado: false
      x-permiso: Permiso fino pendiente de migración en el catálogo
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proveedores'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    patch:
      operationId: operacion_020
      summary: Editar proveedores
      tags:
      - Catálogos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
      x-implementado: false
      x-permiso: Permiso fino pendiente de migración en el catálogo
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proveedores'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '422': *id006
        '503': *id007
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProveedoresEdicion'
  /proveedores/{id}/baja:
    post:
      operationId: operacion_021
      summary: Dar de baja proveedores
      tags:
