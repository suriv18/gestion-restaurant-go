        description: Filtro solicitado, siempre validado contra sedes autorizadas.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      - name: cursor
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
          maxLength: 150
      - name: es_activo
        in: query
