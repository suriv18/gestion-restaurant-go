  /productos/{id}/disponibilidad:
    put:
      operationId: operacion_109
      summary: Pausar o habilitar carta por sede
      tags:
      - Catálogos
      description: >-
        Upsert de la fila (producto, sede); siempre devuelve la fila. Sin fila el producto no se ofrece en esa sede.
        Cambiar solo `disponible` pide CARTA_DISPONIBILIDAD o CARTA_ADMINISTRAR en la sede; `precio_venta` o
        `estacion_id` (opcionales y anulables: ausente = sin cambio, null = precio general / sin estación) piden
        CARTA_ADMINISTRAR (si no, 403 `sede_no_autorizada`). Producto dado de baja: 409 `producto_inactivo`; estación
        inexistente, inactiva o de otra sede: 422 `referencia_invalida` (mismo mensaje en los tres casos, para no revelar estaciones de otras sedes). No altera pedidos ya registrados. No usa Idempotency-Key.
      x-implementado: true
      x-permiso: CARTA_DISPONIBILIDAD | CARTA_ADMINISTRAR
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
