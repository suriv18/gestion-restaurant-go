          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Motivo'
  /clientes/{id}/restauracion:
    post:
      operationId: operacion_016
      summary: Restaurar clientes
      tags:
      - Catálogos
      description: Diseño propuesto. El backend valida permiso, sucursal, campos y estado en una transacción cuando corresponda.
        Idempotency-Key identifica la intención estable. La API debe persistir el resultado; para comandos sin columna propia
        en V4 se requiere diseño y migración adicional. Reactiva el mismo ID; solo los diez maestros principales limpian
        marcadores de baja.
      x-implementado: false
      x-permiso: Permiso fino pendiente de migración en el catálogo
      responses:
        '200':
          description: Resultado confirmado por el servicio; no implica efecto fiscal o bancario externo.
